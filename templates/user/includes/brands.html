<section class="brands-section"><div class="section-header"><h2>Top Brands</h2></div><div class="brands-grid">{% for brand in brands %}<a href="{{ url_for('home', brand=brand.id) }}" class="brand-card">{% if brand.logo %}<img src="{{ uploaded_url(brand.logo) }}" alt="{{ brand.name }}" loading="lazy">{% endif %}<h3>{{ brand.name }}</h3><p>{{ brand.products|selectattr('is_active')|list|length }} products</p></a>{% else %}<p>No brands available.</p>{% endfor %}</div></section>
