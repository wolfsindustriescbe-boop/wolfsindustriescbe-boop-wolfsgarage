<section class="categories"><div class="section-header"><h2>Shop By Category</h2></div><div class="category-grid">{% for category in categories %}<a href="{{ url_for('home', category=category.id) }}" class="category-card">{% if category.image %}<img src="{{ uploaded_url(category.image) }}" alt="{{ category.name }}" loading="lazy">{% else %}<img src="{{ url_for('static', filename='images/placeholder.svg') }}" alt="{{ category.name }}" loading="lazy">{% endif %}<h3>{{ category.name }}</h3></a>{% else %}<p>No categories available.</p>{% endfor %}</div></section>
