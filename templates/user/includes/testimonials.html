<section class="testimonials"><div class="section-header"><h2>Customer Reviews</h2></div><div class="testimonial-grid">{% for review in latest_reviews %}<article class="testimonial-card"><h3>{{ review.user.full_name if review.user else 'Customer' }}</h3><span>{{ review.product.name if review.product else '' }}</span><div class="stars">{{ '★' * review.rating }}</div><p>{{ review.review }}</p></article>{% else %}<p>No approved reviews yet.</p>{% endfor %}</div></section>
